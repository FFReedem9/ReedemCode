<!doctype html>
<html lang="en">
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1">  
  <title>Unlock Redeem Code</title>  
  <meta name="description" content="Unlock Redeem Code">  
  <link rel="stylesheet" href="style.css">
  <style>
    /* Global Reset & Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      color: #ffffff;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Main Page Layout */
    .page {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .video-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .claim-video-label {  
      display: block;  
      font-size: 16px;  
      line-height: 1.4;  
      font-weight: 800;  
      color: #facc15;
      text-align: center;
      text-shadow: 0 2px 10px rgba(250, 204, 21, 0.3);
    }

    /* Video Wrapper */
    .video-wrap {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #6366f1;
      background: #000;
      box-shadow: 0 15px 35px rgba(99, 102, 241, 0.3);
    }
    .main-video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Offer Card */
    .offer-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid #38bdf8;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(56, 189, 248, 0.15);
    }

    .badges {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.6px;
    }
    .badge.new { background: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
    .badge.premium { background: #3b82f6; color: #fff; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }

    .offer-main {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }
    .offer-img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid #38bdf8;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .offer-copy h3 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .offer-copy p {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .stars {
      color: #facc15;
      font-size: 16px;
      letter-spacing: 3px;
    }

    /* Claim Button */
    .claim-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .claim-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.7);
    }

    /* Connect Menu Styles */
    #cashSnapMenu {    
      position: fixed;    
      top: 15px;    
      right: 15px;    
      z-index: 999999;    
    }
    #cashSnapMenuButton {    
      width: 45px;    
      height: 45px;    
      padding: 8px;    
      border: 2px solid #facc15;    
      border-radius: 12px;    
      background: #1e293b;    
      cursor: pointer;
      display: flex;    
      flex-direction: column;    
      justify-content: center;    
      align-items: center;    
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #cashSnapMenuButton span {    
      display: block;    
      width: 22px;    
      height: 2px;    
      background: #facc15;    
      border-radius: 2px;
    }
    #cashSnapMenuDropdown {    
      display: none;
      position: absolute;    
      top: 55px;    
      right: 0;
      width: 150px;    
      padding: 8px;
      background: #1e293b;    
      border: 2px solid #facc15;    
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);    
    }
    #cashSnapMenuDropdown a {    
      display: block;    
      padding: 10px 14px;
      color: #facc15;    
      text-decoration: none;
      font-size: 14px;    
      font-weight: 700;
      border-radius: 8px;
      text-align: center;
      transition: background 0.2s;
    }
    #cashSnapMenuDropdown a:hover {    
      background: #334155;
    }
    #cashSnapMenuDropdown.cashSnapOpen {    
      display: block;
    }

    /* Live Activity Box */
    .sample-activity {  
      width: 100%;  
      margin-top: 10px;  
      padding: 16px;  
      border-radius: 20px;    
      background: rgba(30, 41, 59, 0.8);  
      backdrop-filter: blur(10px);
      border: 2px solid #6366f1;  
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2);  
      color: #fff;
    }
    .sample-activity-title {  
      font-size: 16px;  
      font-weight: 800;  
      margin-bottom: 8px;  
      color: #f8fafc;
    }
    .sample-activity-demo-label {  
      display: inline-block;  
      font-size: 10px;  
      font-weight: 800;  
      letter-spacing: .8px;  
      padding: 4px 10px;  
      border-radius: 999px;      
      margin-bottom: 12px;
      background: #ef4444;  
      color: #ffffff;  
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }
    .sample-activity-row {  
      display: flex;  
      align-items: center;  
      gap: 12px;  
      padding: 12px;      
      border-radius: 14px;  
      animation: sampleActivityIn .35s ease both;
      background: #0f172a;  
      border: 1px solid #334155;  
    }
    .sample-activity-icon {  
      width: 42px;  
      height: 42px;  
      flex: 0 0 42px;  
      border-radius: 50%;  
      overflow: hidden;    
      border: 2px solid #38bdf8;  
      background: #ffffff;  
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .sample-activity-icon img {  
      width: 100%;  
      height: 100%;  
      object-fit: cover;  
      display: block;
    }
    .sample-activity-text {  
      min-width: 0;  
      font-size: 13px;  
      line-height: 1.4;
    }
    .sample-activity-text strong {    
      color: #38bdf8;
    }
    .sample-activity-text span {    
      color: #e2e8f0;
    }
    @keyframes sampleActivityIn {  
      from { opacity: 0; transform: translateY(8px); }  
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
